# Production-focused configuration for WCOA deployments.
# Use with MP_PROJECT_CONFIG=/usr/local/apps/madrona-portal/apps/wcoa/docker/config.wcoa.prod.ini

[APP]
APP_NAME = WCOA Portal
APP_URL = https://portal.westcoastoceans.org
APP_TEAM_NAME = Marine Planner Team
PROJECT_APP = wcoa
PROJECT_SETTINGS_FILE = True
DEBUG = False
TEMPLATE_DEBUG = False
ALLOWED_HOSTS = ["portal.westcoastoceans.org", "www.westcoastoceans.org"]
# SECRET_KEY is loaded from environment variable: SECRET_KEY
MEDIA_ROOT = /usr/local/apps/madrona-portal/media
MEDIA_URL = /media/
TIME_ZONE = UTC
GA_ACCOUNT =
# ReCAPTCHA keys are loaded from env vars: RECAPTCHA_PUBLIC_KEY, RECAPTCHA_PRIVATE_KEY
STATIC_ROOT = /vol/web/static
EMAIL_SUBJECT_PREFIX = [WCOA]
MAP_LIBRARY = ol8
COMPRESS_ENABLED = True
STATIC_CORE = /vol/web/static/
ADDITIONAL_APPS = []
ADDITIONAL_MIDDLEWARE = []

[REGION]
NAME = West Coast Ocean
INIT_ZOOM = 6
INIT_LAT = 39
INIT_LON = -120
MAP = ocean

[CACHES]
BACKEND = django_redis.cache.RedisCache
LOCATION = redis://tasks:6379/1
CLIENT_CLASS = django_redis.client.DefaultClient

[CELERY]
CELERY_RESULT_BACKEND = redis://tasks:6379/1
CELERY_BROKER_URL = redis://tasks:6379/0
CELERY_ALWAYS_EAGER = False
CELERY_DISABLE_RATE_LIMITS = True

[DATABASE]
ENGINE = django.contrib.gis.db.backends.postgis
NAME = wcoa_docker_db
HOST = db
PORT = 5432
USER = postgres
# DB password is loaded from environment variable: DB_PASSWORD

[EMAIL]
HOST = localhost
PORT = 25
# SMTP credentials are loaded from env vars: EMAIL_HOST_USER, EMAIL_HOST_PASSWORD
DEFAULT_FROM_EMAIL = WCOA Portal <portal.westcoastoceans@sccwrp.org>
SERVER_EMAIL = WCOA Site Errors <portal.westcoastoceans@sccwrp.org>

[AWS]
# AWS credentials are loaded from env vars: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
AWS_SES_REGION_NAME = us-east-1
AWS_SES_REGION_ENDPOINT = email.us-east-1.amazonaws.com

[SOCIAL_AUTH]
# Social OAuth credentials are loaded from env vars:
# FACEBOOK_KEY, FACEBOOK_SECRET, TWITTER_KEY, TWITTER_SECRET, GOOGLE_KEY, GOOGLE_SECRET

[CATALOG]
DATA_CATALOG_ENABLED = True
CATALOG_TECHNOLOGY = GeoPortal2
CATALOG_PROXY =
CATALOG_SOURCE = http://elastic:9200
CATALOG_QUERY_ENDPOINT = /geoportal/elastic/metadata/item/_search/
