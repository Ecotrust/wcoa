services:
  app:
    image: ghcr.io/ecotrust/wcoa:${IMAGE_TAG:-latest}
    volumes:
      - ./static:/vol/web/static
      - ./media:/usr/local/apps/madrona-portal/media
      - ./config.wcoa.docker.ini:/usr/local/apps/madrona-portal/apps/wcoa/docker/config.wcoa.docker.ini:ro
    env_file:
      - ./.env
    environment:
      - DB_INIT=${DB_INIT:-0}
      - MP_PROJECT_CONFIG=/usr/local/apps/madrona-portal/apps/wcoa/docker/config.wcoa.docker.ini
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,::1}
      - DEBUG=${DEBUG:-False}
      - DB_ENGINE=${DB_ENGINE:-django.contrib.gis.db.backends.postgis}
      - DB_NAME=${DB_NAME:-wcoa_docker_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}tasks:6379/1
      - CELERY_BROKER_URL=redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}tasks:6379/0
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-admin}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-}
      - DJANGO_ENV=${DJANGO_ENV:-production}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-3}
    depends_on:
      db:
        condition: service_healthy
      tasks:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8008}:8008"
    networks:
      - madronanetwork
    restart: unless-stopped

  db:
    image: postgis/postgis:16-3.4
    volumes:
      - postgis_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-wcoa_docker_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - madronanetwork
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-wcoa_docker_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  tasks:
    image: redis:7-alpine
    command: redis-server ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - madronanetwork
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a ${REDIS_PASSWORD}} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  geoportal:
    image: tomcat:9-jdk11
    ports:
      - 8080:8080
    volumes:
      - gp-volume:/usr/local/tomcat/webapps/
      - harvester_data:/root
      - ${gpt_catalog_war}:/usr/local/tomcat/webapps/geoportal.war
      - ${gpt_harvester_war}:/usr/local/tomcat/webapps/harvester.war
      - ./templates:/templates:ro
      - ./geoportal-entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    networks:
      - madronanetwork
    restart: always
    env_file:
      - ./.env
    depends_on:
      elastic:
        condition: service_healthy

  elastic:
    image: elasticsearch:8.19.12
    volumes:
      - es-volume:/usr/share/elasticsearch/data
      - ./backups/elasticsearch:/usr/share/elasticsearch/backups
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=${CLUSTER_NAME}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=true
      - reindex.remote.whitelist=${ES_REINDEX_REMOTE_WHITELIST}
      - xpack.security.enabled=false
      - path.repo=/usr/share/elasticsearch/backups
    ports:
      - 9200:9200
      - 9300:9300
    networks:
      - madronanetwork
    group_add:
      - "0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health?wait_for_status=yellow"]
      interval: 30s
      timeout: 10s
      retries: 10
    restart: always

  kibana:
    image: kibana:8.19.12
    profiles: ["dev"]
    ports:
      - 127.0.0.1:5601:5601
    environment:
      ELASTICSEARCH_HOSTS: http://elastic:9200
    networks:
      - madronanetwork
    depends_on:
      elastic:
        condition: service_healthy
    restart: no

  nginx:
    image: nginx:alpine
    profiles: ["dev"]
    ports:
      - "8081:80"
    volumes:
      - ./nginx-dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/vol/web/static:ro
      - ./media:/usr/local/apps/madrona-portal/media:ro
    networks:
      - madronanetwork
    depends_on:
      - app
      - geoportal
    restart: no

volumes:
  postgis_data:
  redis_data:
  gp-volume:
  es-volume:
  harvester_data:

networks:
  madronanetwork:
    driver: bridge
